    <script>
      (() => { const q = new URLSearchParams(location.search).get("dark"); let t = null; try { t = localStorage.getItem("signet-theme") } catch {} const d = q !== null ? q === "1" : t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.classList.toggle("dark", d); document.documentElement.style.colorScheme = d ? "dark" : "light" })()
    </script>
