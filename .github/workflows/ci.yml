# Runs the checks CLAUDE.md requires on every PR and push to main, so a bad
# change is caught before release.yml tries to publish it. The scaffolder's
# end-to-end tests (full installs + wrangler dev) are slow, so they run nightly
# and on demand instead of per PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *" # nightly scaffolder e2e
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run changes --check
      - run: bun run scripts/bump.ts --check
      - run: bun run scripts/bump.test.ts
      - run: bun run scripts/check-bumps.ts
      - run: bun run scripts/changes.test.ts
      # Prose like "<reason>" or a bare {total} breaks the docs build.
      - run: bun run scripts/check-mdx.test.ts
      - run: bun run scripts/check-mdx.ts
      # Every ts/tsx block in the docs must show its imports.
      - run: bun run scripts/check-snippets.test.ts
      - run: bun run scripts/check-snippets.ts
      # Packages import each other through dist/ (see release.yml).
      - run: bun run build:all
      - name: test + typecheck
        run: |
          for p in config tokens lib ui server ai db payments spec test mcp cli; do
            (cd packages/$p && bun run test && bun run typecheck)
          done
      - run: bun run typecheck
        working-directory: packages/create-signet-app

  # signet-db's suites against a real Postgres server, on top of the in-process
  # backends the check job already runs. The harness adds this backend only
  # when SIGNET_TEST_PG_URL is set.
  db-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIGNET_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - run: bun run test
        working-directory: packages/db

  # signet-test's Playwright self-test in real Chromium. Screenshot baselines
  # are stored for Linux in packages/test/test/e2e/__screenshots__/linux; a
  # missing or changed one fails here and the rendered images are uploaded.
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - run: npx playwright install --with-deps chromium
        working-directory: packages/test
      - run: bun run test:e2e
        working-directory: packages/test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signet-test-screenshots
          path: |
            packages/test/test/e2e/__screenshots__
            packages/test/test-results
          if-no-files-found: ignore

  # The suites above run under Bun. This loads signet-server's built dist with
  # plain node, through the package's own exports map: adapters, sinks, jobs.
  node-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/server
      - run: node test/node-smoke.mjs
        working-directory: packages/server

  scaffolder-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The node target runs src/server.ts through type stripping (22.18+).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun run build:all
      - run: bun run test
        working-directory: packages/create-signet-app
