# After each push to main: bump every package a pending .changes/*.md names
# (scripts/bump.ts), fold the fragments into CHANGELOG.md and regenerate API.md,
# so PRs never edit versions, CHANGELOG.md or API.md and never conflict on them.
# Commits only when something changed; when a version moved, starts release.yml,
# so every merge with a fragment publishes.
#
# Merges that land together: runs queue (concurrency below) and each starts from
# the newest main, so the first run bumps and releases every fragment there and
# the later ones find nothing left. A merge landing mid-run rejects the push and
# the run redoes its work on the new main.
#
# It cannot loop: the push uses GITHUB_TOKEN, whose pushes trigger no workflows,
# and the message carries [skip ci] as well. release.yml starts only from the
# explicit `gh workflow run` below.
#
# main requires a "Dobby Review" status. Only this job marks its own commit
# passed, and only after checking the commit touches nothing but CHANGELOG.md,
# API.md, .changes/ and the "version" line of packages/*/package.json. It pushes
# to a one-off branch first (a status needs the SHA on GitHub), marks it,
# fast-forwards main, then deletes the branch.
name: post-merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write
  actions: write # gh workflow run release.yml

concurrency:
  group: post-merge
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # bump.ts reads git log to tell its own release commits from hand bumps
      - uses: oven-sh/setup-bun@v2
      # The scripts use node: builtins and fetch only, so no install. A merge can land
      # while this runs; on a rejected push, redo the work on the new main.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            bun run scripts/bump.ts
            bun run changes
            bun run gen:api
            git add -A CHANGELOG.md API.md .changes packages/*/package.json
            git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
            bumped=$(git diff --cached --name-only -- 'packages/*/package.json')
            # The subject must start with RELEASE_COMMIT in scripts/bump.ts.
            git commit -q -m "chore: release, fold changelog fragments, regenerate API.md [skip ci]"
            other=$(git diff --name-only HEAD~1 HEAD | grep -vE '^(CHANGELOG\.md|API\.md|\.changes/|packages/[^/]+/package\.json$)' || true)
            [ -z "$other" ] || { echo "refusing to self-pass, commit touches: $other"; exit 1; }
            lines=$(git diff -U0 HEAD~1 HEAD -- 'packages/*/package.json' | grep -E '^[+-][^+-]' | grep -vE '^[+-]  "version": "[0-9]+\.[0-9]+\.[0-9]+",$' || true)
            [ -z "$lines" ] || { echo "refusing to self-pass, package.json change beyond the version: $lines"; exit 1; }
            tmp="ci/post-merge-${{ github.run_id }}-$attempt"
            git push -q origin "HEAD:refs/heads/$tmp"
            gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
              --field state=success --field context="Dobby Review" \
              --field description="post-merge: generated files only" >/dev/null
            if git push -q origin HEAD:main; then
              git push -q origin --delete "$tmp"
              [ -z "$bumped" ] || gh workflow run release.yml --ref main
              exit 0
            fi
            git push -q origin --delete "$tmp" || true
            sleep $((attempt * 5))
          done
          exit 1
